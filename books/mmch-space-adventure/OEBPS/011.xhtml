  <img src="images/011.jpg" alt="" />  <div class="text-frame" style="left:92px; top:69px; width:627px; height:142px;">    <p class="no-indent">      <span class="font-4">        <span id="w262">Toodles</span>        <span id="w263">brings</span>        <span id="w264">a</span>        <span id="w265">Mouseketool.</span>        <span id="w266">It&#8217;s</span>        <span id="w267">a</span>        <span id="w268">giant</span>        <span id="w269">cookie!</span>        <span id="w270">The</span>        <br/>        <span id="w271">cookie</span>        <span id="w272">floats</span>        <span id="w273">away,</span>        <span id="w274">and</span>        <span id="w275">the</span>        <span id="w276">milk</span>        <span id="w277">cartons</span>        <span id="w278">follow</span>        <span id="w279">it</span>        <span id="w280">into</span>        <span id="w281">space.</span>      </span>    </p>    <p class="no-indent">      <span class="font-4">        <span id="w282">&#8220;Oh,</span>        <span id="w283">space</span>        <span id="w284">sticks!&#8221;</span>        <span id="w285">says</span>        <span id="w286">Space</span>        <span id="w287">Pirate</span>        <span id="w288">Pete.</span>        <span id="w289">&#8220;Foiled</span>        <span id="w290">again!&#8221;</span>      </span>    </p>    <p class="no-indent">      <span class="font-4">        <span id="w291">Minnie</span>        <span id="w292">giggles.</span>        <span id="w293">&#8220;Everyone</span>        <span id="w294">knows</span>        <span id="w295">milk</span>        <span id="w296">goes</span>        <span id="w297">with</span>        <span id="w298">cookies.&#8221;</span>      </span>    </p>  </div><span id="empty"></span></div>
