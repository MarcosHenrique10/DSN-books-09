  <img src="images/022.jpg" alt="" />  <div class="text-frame" style="left:69px; top:69px; width:606px; height:152px;">    <p class="no-indent">      <span class="font-4">        <span id="w608">Mickey</span>        <span id="w609">bumps</span>        <span id="w610">into</span>        <span id="w611">space</span>        <span id="w612">rocks</span>        <span id="w613">until</span>        <span id="w614">Pluto</span>        <span id="w615">rescues</span>        <span id="w616">him.</span>      </span>    </p>    <p class="no-indent">      <span class="font-4">        <span id="w617">&#8220;Thanks,</span>        <span id="w618">Pluto,&#8221;</span>        <span id="w619">says</span>        <span id="w620">Mickey.</span>      </span>    </p>    <p class="no-indent">      <span class="font-4">        <span id="w621">Pluto</span>        <span id="w622">and</span>        <span id="w623">Mickey</span>        <span id="w624">fly</span>        <span id="w625">back</span>        <span id="w626">to</span>        <span id="w627">Saturn</span>        <span id="w628">and</span>        <span id="w629">the</span>        <span id="w630">ship.</span>        <br/>        <span id="w631">On</span>        <span id="w632">the</span>        <span id="w633">way,</span>        <span id="w634">they</span>        <span id="w635">find</span>        <span id="w636">the</span>        <span id="w637">last</span>        <span id="w638">Treasure</span>        <span id="w639">Stars:</span>        <span id="w640">seven,</span>        <br/>        <span id="w641">eight,</span>        <span id="w642">nine,</span>        <span id="w643">and</span>        <span id="w644">ten!</span>      </span>    </p>  </div><span id="empty"></span></div>
