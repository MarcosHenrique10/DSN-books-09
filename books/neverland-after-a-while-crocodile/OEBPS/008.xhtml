    <p class="no-indent">
      <span class="font-9">
        <span id="w159">&#8220;Out</span>
        <span id="w160">of</span>
        <span id="w161">my</span>
        <span id="w162">way,</span>
        <span id="w163">puny</span>
        <span id="w164">pirates,&#8221;</span>
        <span id="w165">says</span>
        <span id="w166">Hook.</span>
        <span id="w167">&#8220;Can&#8217;t</span>
        <span id="w168">you</span>
        <span id="w169">see</span>
        <br/>
        <span id="w170">I&#8217;m</span>
        <span id="w171">looking</span>
        <span id="w172">for</span>
        <span id="w173">treasure?&#8221;</span>
      </span>
    </p>
    <p class="no-indent m1">
      <span class="font-9">
        <span id="w174">&#8220;But</span>
        <span id="w175">you&#8217;re</span>
        <span id="w176">heading</span>
        <span id="w177">for</span>
        <span id="w178">Crocodile</span>
        <span id="w179">Creek,&#8221;</span>
        <span id="w180">says</span>
        <span id="w181">Izzy.</span>
      </span>
    </p>
    <p class="no-indent m1">
      <span class="font-9">
        <span id="w182">&#8220;So</span>
        <span id="w183">what</span>
        <span id="w184">if</span>
        <span id="w185">I</span>
        <span id="w186">am?&#8221;</span>
        <span id="w187">asks</span>
        <span id="w188">Hook.</span>
      </span>
    </p>
    <p class="no-indent m2">
      <span class="font-7 allcaps"></span><span class="font-10"><span id="w189">&#8220;A<span class="font-14" id="w190">W,</span></span></span>
      <span class="font-14"><span id="w191">COCONUTS!&#8221;</span></span><span class="font-10 allcaps"></span><span class="font-9">
        <span id="w192">says</span>
        <span id="w193">Cubby.</span>
        <span id="w194">&#8220;There&#8217;s</span>
        <span id="w195">a</span>
        <span id="w196">whole</span>

        <span id="w198">of</span>
