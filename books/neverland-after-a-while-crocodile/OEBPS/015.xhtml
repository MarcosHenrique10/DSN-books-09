    <p class="no-indent">
      <span class="font-7 allcaps"></span>
      <span class="font-7">
        <span id="w394">&#8220;A<span class="font-18">HA!</span></span>
      </span>
      <span class="font-9">
        <span id="w396">You</span>
        <span id="w397">bumbling</span>
        <span id="w398">buffoons</span>
        <span id="w399">have</span>
        <span id="w400">given</span>
        <span id="w401">me</span>
        <span id="w402">an</span>
        <span id="w403">idea,&#8221;</span>
        <br/>
        <span id="w404">says</span>
        <span id="w405">Hook.</span>
        <span id="w406">&#8220;I&#8217;ll</span>
        <span id="w407">blast</span>
        <span id="w408">this</span>
        <span id="w409">net</span>
        <span id="w410">into</span>
        <span id="w411">Crocodile</span>
        <span id="w412">Creek,</span>
        <br/>
        <span id="w413">and</span>
        <span id="w414">while</span>
        <span id="w415">the</span>
        <span id="w416">crocs</span>
        <span id="w417">are</span>
        <span id="w418">trapped,</span>
        <span id="w419">I&#8217;ll</span>
        <span id="w420">stroll</span>
        <span id="w421">in</span>
        <span id="w422">and</span>
        <span id="w423">claim</span>
        <br/>
        <span id="w424">me</span>
        <span id="w425">prize!&#8221;</span>
      </span>
    </p>
    <p class="no-indent m1">
      <span class="font-9">
        <span id="w426">&#8220;That</span>
        <span id="w427">doesn&#8217;t</span>
        <span id="w428">sound</span>
        <span id="w429">like</span>
        <span id="w430">a</span>
        <span id="w431">very</span>
        <span id="w432">nice</span>
        <span id="w433">thing</span>
        <span id="w434">to</span>
        <span id="w435">do,&#8221;</span>
        <span id="w436">says</span>
        <span id="w437">Smee.</span>
      </span>
    </p>
    <p class="no-indent m1">
      <span class="font-9">
        <span id="w438">&#8220;Nice</span>
        <span id="w439">shmice,&#8221;</span>
        <span id="w440">says</span>
        <span id="w441">Hook.</span>
        <span id="w442">&#8220;I</span>
        <span id="w443">want</span>
        <span id="w444">that</span>
        <span id="w445">treasure.&#8221;</span>
      </span>
    </p>
